<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gmail</title>
<link rel="icon" href="icons/gmail.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg1:#0b1020;
  --bg2:#111a3a;
  --accent:#00e5ff;
  --accent2:#8a2be2;
  --glass:rgba(255,255,255,0.06);
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  color:white;
  overflow:hidden;
}

h1{
  text-align:center;
  margin:20px 0 10px;
  font-size:2.2em;
  text-shadow:0 0 10px var(--accent);
}

/* TABS */
.tabs{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:10px;
}

.tab{
  padding:10px 20px;
  border-radius:12px;
  cursor:pointer;
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  transition:0.3s;
  user-select:none;
}

.tab.active{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 15px var(--accent);
}

/* SECTIONS */
.section{
  display:none;
  padding:20px;
}

.section.active{
  display:block;
}

/* GRID */
.grid{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

/* CARD */
.card{
  width:200px;
  padding:20px;
  border-radius:18px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  text-align:center;
  cursor:pointer;
  transition:0.2s;
  position:relative;
}

/* HOVER SOLO (PC STYLE) */
.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px var(--accent);
  border-color:var(--accent);
}

/* ICONOS */
.icon{
  width:80px;
  height:80px;
  margin-bottom:10px;
}

.title{
  font-weight:bold;
  letter-spacing:1px;
}

/* ❌ ELIMINAR BORDE AZUL DEL NAVEGADOR */
.card,
.card:focus,
.card:active,
.card:focus-visible{
  outline:none !important;
}
</style>
</head>

<body>

<h1>🎮 HUB ANTI LUGUS</h1>

<div class="tabs">
  <div class="tab active" onclick="show('juegos',this)">Juegos</div>
  <div class="tab" onclick="show('tools',this)">Tools</div>
</div>

<!-- JUEGOS -->
<div id="juegos" class="section active">
  <div class="grid">

    <div class="card" onclick="openApp('Juegos/lugus_killer/Browser.html')">
      <img class="icon" src="icons/browser.svg">
      <div class="title">Browser</div>
    </div>

    <div class="card" onclick="openApp('Juegos/pokemon.html')">
      <img class="icon" src="icons/pokemon.svg">
      <div class="title">Pokemon</div>
    </div>

    <div class="card" onclick="openApp('Juegos/spacers.html')">
      <img class="icon" src="icons/spacers.svg">
      <div class="title">Spacers</div>
    </div>

    <div class="card" onclick="openApp('Juegos/toilettycoon/index.html')">
  <img class="icon" src="icons/toilet.svg">
  <div class="title">Toilet Tycoon</div>
</div>

  </div>
</div>

<!-- TOOLS -->
<div id="tools" class="section">
  <div class="grid">

    <div class="card" onclick="openApp('Tools/chatonline.html')">
      <img class="icon" src="icons/chat.svg">
      <div class="title">Chat</div>
    </div>

    <div class="card" onclick="openApp('Tools/Videollamada.html')">
      <img class="icon" src="icons/video.svg">
      <div class="title">Videollamada</div>
    </div>

    <div class="card" onclick="openApp('Tools/text.html')">
      <img class="icon" src="icons/text.svg">
      <div class="title">Text</div>
    </div>

    <div class="card" onclick="openApp('Tools/paint.html')">
      <img class="icon" src="icons/paint.svg">
      <div class="title">Paint</div>
    </div>

    <div class="card" onclick="openApp('Tools/calculadora.html')">
      <img class="icon" src="icons/calculator.svg">
      <div class="title">Calculadora</div>
    </div>

  </div>
</div>

<script>

function openApp(url){
  window.open(url,'_blank');
}

function show(id, el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

/* 🔥 eliminar cualquier focus del navegador */
document.addEventListener('mousedown', ()=>{
  if(document.activeElement){
    document.activeElement.blur();
  }
});

window.addEventListener('focus', ()=>{
  if(document.activeElement){
    document.activeElement.blur();
  }
}, true);

</script>

</body>
</html>
